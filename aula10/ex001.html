<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            background: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clique()" onmouseenter="entrar()" onmouseout="sair()">
        Interaja...
    </div>
</body>
<script>
    function sair() {
        var area = document.getElementById('area');
        area.innerText = "Saiu";
        area.style.background = "green";
    }

    function entrar() {
        var area = document.getElementById('area');
        area.innerText = "Entrou";
    }

    function clique() {
        var area = document.getElementById('area');
        area.innerText = "Clicou";
        area.style.background = "red";
    }
</script>
</html>
