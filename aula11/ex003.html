<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
    <style>

    </style>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="verificar" onclick="calcular()"><br>
    <div id="res"></div>
</body>
<script>
    function calcular() {
        var txtvel = document.getElementById('txtvel')
        var res = document.getElementById('res')
        var vel = Number.parseInt(txtvel.value)
        res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel}Km/h</strong></p>`
        if(vel > 60) {
            res.innerHTML += '<p>Você está <strong>MULTADO</strong> por exesso de velocidade</p>'
        }
        res.innerHTML += '<p>Dirija sempre com sinto de segurança</p>'
    }
</script>
</html>
